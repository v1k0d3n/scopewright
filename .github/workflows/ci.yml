name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned images (see the publish job).
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged code still surface.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-and-run:
    name: Build and smoke-test the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the production server and exercise it
        run: |
          PORT=3000 DATA_DIR="$RUNNER_TEMP/data" npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          set -x
          curl -sf http://localhost:3000/ | grep -q '<title>'
          curl -sf http://localhost:3000/api/workspace/me | grep -q '"mode":"open"'
          curl -sf -X PUT -H 'content-type: application/json' -d '{"orgName":"CI"}' http://localhost:3000/api/workspace/branding | grep -q savedAt
          curl -sf http://localhost:3000/api/workspace/branding | grep -q '"orgName":"CI"'
          # A catalog save must carry the current format version; anything else (a tab left open across an update) is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{"products":[]}' http://localhost:3000/api/workspace/catalog)" = "409"
          # In proxy mode an anonymous write must be refused.
          kill %1; sleep 1
          AUTH_MODE=proxy PORT=3001 DATA_DIR="$RUNNER_TEMP/data" npm start > server2.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3001/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -d '{}' http://localhost:3001/api/workspace/branding)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'content-type: application/json' -H 'x-forwarded-user: ci' -d '{}' http://localhost:3001/api/workspace/branding)" = "200"
      - name: Server logs
        if: failure()
        run: cat server.log server2.log 2>/dev/null || true

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with the project Containerfile
        run: |
          docker build -f Containerfile -t scopewright:ci \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} .
      - name: Image starts and serves
        run: |
          docker run -d --rm --name sw -p 3000:3000 scopewright:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -sf http://localhost:3000/api/workspace/me | grep -q '"mode":"open"'
          docker stop sw
      # Hand the image that just passed to the publish job, so the pushed image
      # is the tested one rather than a rebuild.
      - name: Save the image for publishing
        if: github.event_name == 'push'
        run: docker save scopewright:ci -o "$RUNNER_TEMP/scopewright.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: scopewright-image
          path: ${{ runner.temp }}/scopewright.tar
          retention-days: 1

  deployments:
    name: Render and validate deployment targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/deployment-checks"
          "$RUNNER_TEMP/deployment-checks/bin/python" -m pip install PyYAML==6.0.3
      - name: Check shared, OpenShift, and systemd manifests
        run: '"$RUNNER_TEMP/deployment-checks/bin/python" scripts/check-deployments.py'

  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies gate the build at moderate and above; the full
      # tree (build tooling included) fails on high, apart from the reviewed,
      # expiring exceptions in scripts/audit-exceptions.json.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: node scripts/check-audit.mjs

  codeql:
    name: CodeQL
    # Code scanning is available on public repositories, and on private ones
    # only with GitHub Advanced Security; skip rather than fail elsewhere.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  publish:
    name: Publish image to Quay
    # Pushes to main and v* tags only, never pull requests, and only once every
    # other job has passed. CodeQL may be skipped (private repositories), which
    # must not block publishing, hence the explicit result checks.
    needs: [quality, build-and-run, container, deployments, dependency-audit, codeql]
    if: >-
      github.event_name == 'push' && !cancelled() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # The registry credentials live in this environment, which only main and
    # v* tags may deploy from.
    environment: Quay
    permissions:
      contents: read
      # Keyless signing and provenance use the workflow's OIDC identity.
      id-token: write
      attestations: write
    env:
      IMAGE: quay.io/bjozsa-redhat/scopewright
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scopewright-image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/scopewright.tar"
      # main -> latest; v1.2.3 -> v1.2.3 and 1.2.3; every push -> sha-<short>.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      # Push only the commit tag first. latest and release tags are added once
      # the digest is signed and attested, so they never name an image that
      # lacks its verification material.
      - name: Push the commit tag
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          staging=$(printf '%s\n' "$TAGS" | grep ':sha-')
          docker tag scopewright:ci "$staging"
          docker push "$staging"
          # Ask the registry, so signing and attestation name what it stored.
          digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Promote latest and release tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in $(printf '%s\n' "$TAGS" | grep -v ':sha-'); do
            docker tag scopewright:ci "$tag"
            docker push "$tag"
            # Every tag must name the digest that was signed.
            test "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          done
          echo "Published $IMAGE@$DIGEST as: $TAGS" >> "$GITHUB_STEP_SUMMARY"
