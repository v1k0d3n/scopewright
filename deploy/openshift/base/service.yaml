apiVersion: v1
kind: Service
metadata:
  name: scopewright
  labels:
    app: scopewright
  annotations:
    # The cluster issues a TLS certificate for the proxy into this Secret.
    service.beta.openshift.io/serving-cert-secret-name: scopewright-tls
spec:
  selector:
    app: scopewright
  ports:
    - name: https
      port: 443
      targetPort: https
