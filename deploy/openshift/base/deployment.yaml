# Add OpenShift's OAuth sidecar and rollout behavior to the shared app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scopewright
  annotations:
    # Roll out automatically whenever a new build lands in the ImageStream.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"scopewright:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]
spec:
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: scopewright
      containers:
        # The app listens on localhost only, so the proxy is the sole way in.
        - name: web
          args: ["node", "node_modules/vinext/dist/cli.js", "start", "--hostname", "127.0.0.1"]
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            initialDelaySeconds: 3
            periodSeconds: 10
        # OpenShift's oauth-proxy: cluster login through any identity provider
        # configured on the cluster, then identity headers to the app. This is
        # the public upstream build, so it pulls without release-payload
        # credentials; pin it near your cluster's minor version.
        - name: oauth-proxy
          image: quay.io/openshift/origin-oauth-proxy:4.22
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=scopewright
            - --upstream=http://127.0.0.1:3000
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-expire=8h
            - --openshift-sar={"namespace":"scopewright","resource":"configmaps","resourceName":"scopewright-access","verb":"get"}
            - --pass-user-headers=true
            - --skip-provider-button=true
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
            - name: session
              mountPath: /etc/proxy/secrets
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # Retain the shared data volume first when merging the extra volumes.
        - name: data
        - name: tls
          secret:
            secretName: scopewright-tls
        - name: session
          secret:
            secretName: scopewright-session
