# The proxy runs as this ServiceAccount. The annotation registers the Route as
# an OAuth redirect so the cluster's OAuth server will send users back here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scopewright
  labels:
    app: scopewright
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"scopewright"}}'
