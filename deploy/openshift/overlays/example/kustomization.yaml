# Copy this directory to deploy/openshift/overlays/local (git-ignored) and
# fill in your own values. deploy/openshift/build.sh uses overlays/local when
# it exists, otherwise the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Public hostname of the app. Must be under your cluster's apps domain.
  - target:
      kind: Route
      name: scopewright
    patch: |
      - op: replace
        path: /spec/host
        value: scopewright.apps.example.com
  # Who may change the shared catalog and theme (usernames as your identity
  # provider reports them, or emails). Empty means every admitted user.
  - target:
      kind: ConfigMap
      name: scopewright-config
    patch: |
      - op: replace
        path: /data/AUTH_EDITORS
        value: "alice, bob@example.com"
  # Optional: run an image you built or pulled yourself instead of building on
  # the cluster. Point the Deployment at it (the BuildConfig then goes unused):
  #   podman build -t quay.io/you/scopewright:0.1.0 -f Containerfile . && podman push quay.io/you/scopewright:0.1.0
  # - target:
  #     kind: Deployment
  #     name: scopewright
  #   patch: |
  #     - op: replace
  #       path: /spec/template/spec/containers/0/image
  #       value: quay.io/you/scopewright:0.1.0
  #     - op: remove
  #       path: /metadata/annotations/image.openshift.io~1triggers
